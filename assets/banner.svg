<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jellyfin Media Server Stack</title>
  <desc id="desc">A reproducible, private-by-default Docker media platform.</desc>
  <defs>
    <linearGradient id="accent" x1="80" y1="55" x2="1060" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54D6C5"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A2C"/>
      <stop offset="1" stop-color="#090E1A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02040A" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#panel)"/>
  <path d="M0 298C234 250 365 337 585 300c246-42 375-157 615-104v164H0Z" fill="#121F35"/>
  <path d="M0 315c229-41 374 26 587-8 251-40 382-139 613-93" fill="none" stroke="url(#accent)" stroke-opacity=".26" stroke-width="2"/>
  <g transform="translate(74 58) scale(.48)" filter="url(#shadow)">
