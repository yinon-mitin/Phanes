    <path d="M112 158 256 83l144 75-144 75-144-75Z" fill="#142239" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>
    <path d="m112 242 144-75 144 75-144 75-144-75Z" fill="#111D31" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>
    <path d="m112 326 144-75 144 75-144 75-144-75Z" fill="#0E192B" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>
    <path d="m232 190 78 66-78 66V190Z" fill="#F4F8FF" stroke="#F4F8FF" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <g fill="#F5F8FF" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="375" y="139" font-size="54" font-weight="720" letter-spacing="-1.4">Jellyfin Media Server Stack</text>
    <text x="378" y="192" fill="#A9B8CE" font-size="25" font-weight="450">Reproducible. Observable. Private by default.</text>
  </g>
