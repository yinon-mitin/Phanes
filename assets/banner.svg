<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Phanes — Jellyfin Media Server Stack</title>
  <desc id="desc">Phanes is a reproducible, private-by-default Docker media platform.</desc>
  <defs>
