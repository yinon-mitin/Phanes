name: jellyfin-media-server

x-linuxserver-environment: &linuxserver-environment
  TZ: ${TZ:-UTC}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qbittorrent:
    image: ${QBITTORRENT_IMAGE:?Load stack/versions.env}
    environment:
      <<: *linuxserver-environment
      WEBUI_PORT: 9090
    ports:
      - "9090:9090"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/qbittorrent:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in stack/.env}:/media
    restart: unless-stopped
    logging: *default-logging

  prowlarr:
    image: ${PROWLARR_IMAGE:?Load stack/versions.env}
    environment:
      <<: *linuxserver-environment
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
    ports:
      - "9696:9696"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/prowlarr:/config
    restart: unless-stopped
    logging: *default-logging

  sonarr:
    image: ${SONARR_IMAGE:?Load stack/versions.env}
    environment: *linuxserver-environment
    ports:
      - "8989:8989"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/sonarr:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in stack/.env}:/media
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prowlarr
      - qbittorrent

  radarr:
    image: ${RADARR_IMAGE:?Load stack/versions.env}
    environment: *linuxserver-environment
    ports:
      - "7878:7878"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/radarr:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in stack/.env}:/media
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prowlarr
      - qbittorrent

  bazarr:
    image: ${BAZARR_IMAGE:?Load stack/versions.env}
    environment: *linuxserver-environment
    ports:
      - "6767:6767"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/bazarr:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in stack/.env}:/media
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - sonarr
      - radarr

  jellyseerr:
    image: ${JELLYSEERR_IMAGE:?Load stack/versions.env}
    init: true
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "5055:5055"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/jellyseerr:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:?Load stack/versions.env}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: ${TZ:-UTC}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    restart: unless-stopped
    logging: *default-logging

  jellyfin:
    image: ${JELLYFIN_IMAGE:?Load stack/versions.env}
    environment: *linuxserver-environment
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/jellyfin:/config
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/jellyfin-cache:/cache
      - ${JELLYFIN_AUX_CACHE:?Set JELLYFIN_AUX_CACHE in stack/.env}:/jellyfin-cache
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in stack/.env}:/media
    restart: unless-stopped
    logging: *default-logging

  profilarr:
    image: ${PROFILARR_IMAGE:?Load stack/versions.env}
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "6868:6868"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/profilarr:/config
    restart: unless-stopped
    logging: *default-logging

  homarr:
    image: ${HOMARR_IMAGE:?Load stack/versions.env}
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY:?Set HOMARR_SECRET_ENCRYPTION_KEY in stack/.env}
    ports:
      - "7575:7575"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/homarr:/appdata
    restart: unless-stopped
    logging: *default-logging

  recyclarr:
    image: ${RECYCLARR_IMAGE:?Load stack/versions.env}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/recyclarr:/config
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - radarr
      - sonarr

  notifiarr:
    image: ${NOTIFIARR_IMAGE:?Load stack/versions.env}
    profiles: ["notifiarr"]
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "5454:5454"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/notifiarr:/config
    restart: unless-stopped
    logging: *default-logging

  autobrr:
    image: ${AUTOBRR_IMAGE:?Load stack/versions.env}
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "7474:7474"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/autobrr:/config
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - qbittorrent

  torrserver:
    image: ${TORRSERVER_IMAGE:?Load stack/versions.env}
    network_mode: host
    environment:
      TS_PORT: 18090
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/torrserver/config:/opt/ts/config
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/torrserver/cache:/opt/ts/torrents
    restart: unless-stopped
    logging: *default-logging

  jackett:
    image: ${JACKETT_IMAGE:?Load stack/versions.env}
    environment:
      <<: *linuxserver-environment
      AUTO_UPDATE: "false"
    ports:
      - "9117:9117"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/jackett:/config
      - ${DOWNLOADS_ROOT:?Set DOWNLOADS_ROOT in stack/.env}:/downloads
    restart: unless-stopped
    logging: *default-logging

  qbit_manage:
    image: ${QBIT_MANAGE_IMAGE:?Load stack/versions.env}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT in stack/.env}/qbit_manage:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in stack/.env}:/media
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - qbittorrent

  aperture:
    image: ${APERTURE_IMAGE:?Load stack/versions.env}
    platform: linux/amd64
    environment:
      DEFAULT_SERVER_URL: http://jellyfin:8096
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - jellyfin
